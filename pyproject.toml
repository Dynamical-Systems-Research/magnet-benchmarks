[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "magnet-benchmarks"
version = "0.1.0"
description = "Open experimental magnet records and a standalone 0% heavy-rare-earth demagnetization model"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["magnet_benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
